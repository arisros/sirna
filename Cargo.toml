[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/xtask",
]
# wasm, ffi and server land in M2/M3. They stay out of `members` until they have
# real contents so that `cargo test --workspace` is green from day one.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/arisros/sirna"

[workspace.dependencies]
sirna-core = { path = "crates/core" }

# Crypto. Versions are pinned tightly on purpose: the wire format is a property
# of the spec, and a minor bump that changes a default would silently break the
# committed test vectors.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
blake3           = { version = "1.5", default-features = false }
argon2           = { version = "0.5", default-features = false, features = ["alloc"] }
rand_core        = { version = "0.6", default-features = false }
rand_chacha      = { version = "0.3", default-features = false }
zeroize          = { version = "1.8", features = ["derive"] }
subtle           = { version = "2.6", default-features = false }

ciborium = { version = "0.2", default-features = false }
serde    = { version = "1", default-features = false, features = ["derive", "alloc"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
